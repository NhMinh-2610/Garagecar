<text x="985" y="403" text-anchor="middle" font-size="16" fill="#182d49">Kế toán / admin + finance</text>
<text x="985" y="426.2" text-anchor="middle" font-size="16" fill="#182d49">QC nếu có lượt dịch vụ</text>
<text x="985" y="449.4" text-anchor="middle" font-size="16" fill="#182d49">Một chứng từ thu</text>
<text x="50" y="545" text-anchor="start" font-size="16" fill="#182d49">Phiếu trực tiếp ở draft có thể xóa và trả kho; phiếu gắn báo giá không được xóa.</text>
<text x="50" y="568.2" text-anchor="start" font-size="16" fill="#182d49">Mở lại một hạng mục trong khi working tăng evidenceRound, không đổi vòng đời phiếu.</text>
<text x="50" y="591.4" text-anchor="start" font-size="16" fill="#182d49">Gửi lại thao tác paid không tạo lần thu thứ hai. Không có trạng thái refunded/partial-paid trong bản này.</text></g></svg>
