<rect x="265" y="370" width="295" height="100" rx="12" fill="#f0f3f7" stroke="#8096b0" stroke-width="1.5" />
<text x="412.5" y="403" text-anchor="middle" font-size="16" fill="#182d49">Thợ được giao / admin</text>
<text x="412.5" y="426.2" text-anchor="middle" font-size="16" fill="#182d49">Có quyền workshop</text>
<text x="412.5" y="449.4" text-anchor="middle" font-size="16" fill="#182d49">Phiếu đủ điều kiện bắt đầu</text>
<rect x="585" y="370" width="250" height="100" rx="12" fill="#f0f3f7" stroke="#8096b0" stroke-width="1.5" />
<text x="710" y="403" text-anchor="middle" font-size="16" fill="#182d49">Tất cả hạng mục xong</text>
<text x="710" y="426.2" text-anchor="middle" font-size="16" fill="#182d49">Bằng chứng hợp lệ</text>
<text x="710" y="449.4" text-anchor="middle" font-size="16" fill="#182d49">Đúng lần thực hiện</text>
