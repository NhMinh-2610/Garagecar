<polyline points="730,784 785,784" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="785,784 776,780 776,788" fill="#526c8a"/>
<text x="50" y="1100" text-anchor="start" font-size="16" fill="#182d49">Thu tiền không đồng nghĩa giao xe. Mũi tên đi xuống chỉ tiếp tục khi điều kiện của bước đã đạt.</text></g></svg>
