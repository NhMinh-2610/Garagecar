<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1140" viewBox="0 0 1120 1140" role="img" aria-labelledby="title"><title id="title">03-service-activity</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526c8a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="43" text-anchor="start" font-size="26" fill="#182d49">03 · Luồng hoạt động dịch vụ</text>
<text x="40" y="75" text-anchor="start" font-size="15" fill="#53657a">Luồng thông thường theo lượt; các nhánh lỗi giữ dữ liệu để chỉnh sửa, không lưu giao dịch dở dang.</text>
