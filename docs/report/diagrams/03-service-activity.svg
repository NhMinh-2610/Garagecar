<polygon points="785,578 776,574 776,582" fill="#526c8a"/>
<rect x="785" y="720" width="285" height="100" rx="12" fill="#fff3db" stroke="#8096b0" stroke-width="1.5" />
<text x="927.5" y="753" text-anchor="middle" font-size="16" fill="#182d49">Thiếu bằng chứng / chưa QC</text>
<text x="927.5" y="776.2" text-anchor="middle" font-size="16" fill="#182d49">Chặn chuyển bước</text>
<text x="927.5" y="799.4" text-anchor="middle" font-size="16" fill="#182d49">Hoàn thiện điều kiện</text>
<polyline points="730,681 765,681 765,755 785,755" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
