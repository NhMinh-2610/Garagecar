<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title"><title id="title">07-data-support</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526c8a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="43" text-anchor="start" font-size="26" fill="#182d49">07 · Quan hệ nhân sự và hộp thư</text>
<text x="40" y="75" text-anchor="start" font-size="15" fill="#53657a">Mũi tên từ bảng con tới bảng cha; trường người tạo/duyệt chi tiết xem từ điển dữ liệu.</text>
<rect x="435" y="135" width="260" height="95" rx="12" fill="#e7f7ee" stroke="#8096b0" stroke-width="1.5" />
<text x="565" y="177" text-anchor="middle" font-size="16" fill="#182d49">users</text>
<text x="565" y="200.2" text-anchor="middle" font-size="16" fill="#182d49">PK id · 5 vai trò</text>
<rect x="40" y="330" width="245" height="110" rx="12" fill="#eaf2ff" stroke="#8096b0" stroke-width="1.5" />
<text x="162.5" y="368" text-anchor="middle" font-size="16" fill="#182d49">employee_profiles</text>
<text x="162.5" y="391.2" text-anchor="middle" font-size="16" fill="#182d49">userId PK/FK</text>
<text x="162.5" y="414.4" text-anchor="middle" font-size="16" fill="#182d49">Tối đa 1 hồ sơ / user</text>
<polyline points="162,330 162,280 565,280 565,230" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="565,230 561,239 569,239" fill="#526c8a"/>
<rect x="305" y="330" width="245" height="110" rx="12" fill="#eaf2ff" stroke="#8096b0" stroke-width="1.5" />
<text x="427.5" y="368" text-anchor="middle" font-size="16" fill="#182d49">staff_shifts</text>
<text x="427.5" y="391.2" text-anchor="middle" font-size="16" fill="#182d49">userId FK</text>
<text x="427.5" y="414.4" text-anchor="middle" font-size="16" fill="#182d49">Nhiều ca / user</text>
<polyline points="427,330 427,280 565,280 565,230" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="565,230 561,239 569,239" fill="#526c8a"/>
<rect x="570" y="330" width="245" height="110" rx="12" fill="#eaf2ff" stroke="#8096b0" stroke-width="1.5" />
<text x="692.5" y="368" text-anchor="middle" font-size="16" fill="#182d49">leave_requests</text>
<text x="692.5" y="391.2" text-anchor="middle" font-size="16" fill="#182d49">userId FK</text>
<text x="692.5" y="414.4" text-anchor="middle" font-size="16" fill="#182d49">Nhiều đơn / user</text>
<polyline points="692,330 692,280 565,280 565,230" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="565,230 561,239 569,239" fill="#526c8a"/>
<rect x="835" y="330" width="245" height="110" rx="12" fill="#eaf2ff" stroke="#8096b0" stroke-width="1.5" />
<text x="957.5" y="368" text-anchor="middle" font-size="16" fill="#182d49">staff_certificates</text>
<text x="957.5" y="391.2" text-anchor="middle" font-size="16" fill="#182d49">userId FK</text>
<text x="957.5" y="414.4" text-anchor="middle" font-size="16" fill="#182d49">Nhiều chứng chỉ / user</text>
<polyline points="957,330 957,280 565,280 565,230" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="565,230 561,239 569,239" fill="#526c8a"/>
<rect x="40" y="570" width="285" height="115" rx="12" fill="#eaf2ff" stroke="#8096b0" stroke-width="1.5" />
<text x="182.5" y="599" text-anchor="middle" font-size="16" fill="#182d49">support_conversations</text>
<text x="182.5" y="622.2" text-anchor="middle" font-size="16" fill="#182d49">customerId → users</text>
<text x="182.5" y="645.4" text-anchor="middle" font-size="16" fill="#182d49">advisorId → users (nullable)</text>
<text x="182.5" y="668.6" text-anchor="middle" font-size="16" fill="#182d49">vehicleId → vehicles (nullable)</text>
<rect x="430" y="570" width="290" height="115" rx="12" fill="#eaf2ff" stroke="#8096b0" stroke-width="1.5" />
<text x="575" y="599" text-anchor="middle" font-size="16" fill="#182d49">support_messages</text>
<text x="575" y="622.2" text-anchor="middle" font-size="16" fill="#182d49">conversationId FK</text>
<text x="575" y="645.4" text-anchor="middle" font-size="16" fill="#182d49">senderId → users</text>
<text x="575" y="668.6" text-anchor="middle" font-size="16" fill="#182d49">UUID chống trùng</text>
<rect x="825" y="570" width="260" height="115" rx="12" fill="#eaf2ff" stroke="#8096b0" stroke-width="1.5" />
<text x="955" y="599" text-anchor="middle" font-size="16" fill="#182d49">support_reads</text>
<text x="955" y="622.2" text-anchor="middle" font-size="16" fill="#182d49">PK conversationId + userId</text>
<text x="955" y="645.4" text-anchor="middle" font-size="16" fill="#182d49">lastReadMessageId: số</text>
<text x="955" y="668.6" text-anchor="middle" font-size="16" fill="#182d49">không phải FK</text>
<polyline points="430,625 325,625" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="325,625 334,629 334,621" fill="#526c8a"/>
<text x="378" y="611" text-anchor="middle" font-size="14" fill="#182d49">conversationId</text>
<polyline points="955,685 955,755 180,755 180,685" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="180,685 176,694 184,694" fill="#526c8a"/>
<text x="540" y="743" text-anchor="middle" font-size="14" fill="#182d49">conversationId</text>
<text x="50" y="815" text-anchor="start" font-size="15" fill="#182d49">users → hội thoại/tin/con trỏ: một người có nhiều bản ghi; mỗi FK user bắt buộc trỏ đúng một tài khoản.</text>
<text x="50" y="836.75" text-anchor="start" font-size="15" fill="#182d49">Tin nhắn duy nhất theo conversationId + senderId + clientMessageId; con trỏ đọc riêng từng người.</text>
<text x="50" y="858.5" text-anchor="start" font-size="15" fill="#182d49">HR là chức năng của admin, không phải bảng hay vai trò mới. Migration giữ nguyên userId và toàn bộ lịch sử.</text></g></svg>
