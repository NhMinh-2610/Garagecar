<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" role="img" aria-labelledby="title"><title id="title">01-architecture</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526c8a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="43" text-anchor="start" font-size="26" fill="#182d49">01 · Kiến trúc GarageCar</text>
<text x="40" y="75" text-anchor="start" font-size="15" fill="#53657a">Đường liền: đã triển khai. Đường nét đứt: hạng mục trong phiếu nhiệm vụ chưa có source.</text>
<rect x="40" y="125" width="300" height="110" rx="12" fill="#eaf2ff" stroke="#8096b0" stroke-width="1.5" />
