<text x="550" y="370.5" text-anchor="middle" font-size="16" fill="#182d49">FastAPI · Một backend, các router theo nghiệp vụ</text>
<text x="550" y="393.7" text-anchor="middle" font-size="16" fill="#182d49">Xác thực → quyền → kiểm tra đầu vào → xử lý giao dịch</text>
<text x="550" y="416.9" text-anchor="middle" font-size="16" fill="#182d49">Dịch vụ · Kho · Tài chính · Nhân sự · Bảo dưỡng · Hộp thư</text>
<polyline points="550,445 550,505" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
