<text x="570" y="186.2" text-anchor="middle" font-size="16" fill="#182d49">Cùng mã frontend HTML/CSS/JS</text>
<text x="570" y="209.4" text-anchor="middle" font-size="16" fill="#182d49">Manifest + Service Worker</text>
