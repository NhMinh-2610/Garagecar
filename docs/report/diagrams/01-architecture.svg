<polygon points="180,390 171,386 171,394" fill="#526c8a"/>
<text x="550" y="662" text-anchor="middle" font-size="16" fill="#182d49">Không AI. Worker nhắc hạn chạy cùng backend; người phụ trách duyệt công bố.</text>
<text x="550" y="685.2" text-anchor="middle" font-size="16" fill="#182d49">PWA không cache giao dịch API và cần mạng để đọc/ghi dữ liệu cá nhân.</text></g></svg>
