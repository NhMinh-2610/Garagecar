<text x="550" y="549.5" text-anchor="middle" font-size="16" fill="#182d49">PostgreSQL</text>
<text x="550" y="572.7" text-anchor="middle" font-size="16" fill="#182d49">Hồ sơ, tiền/tồn, lịch sử, ảnh và tin nhắn</text>
