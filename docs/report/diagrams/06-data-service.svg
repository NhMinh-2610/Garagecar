<text x="230" y="776" text-anchor="middle" font-size="14" fill="#182d49">inventoryId</text>
<polyline points="540,820 540,715" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="540,715 536,724 544,724" fill="#526c8a"/>
<text x="575" y="776" text-anchor="middle" font-size="14" fill="#182d49">itemId</text>
<text x="50" y="1000" text-anchor="start" font-size="15" fill="#182d49">Các FK người tạo/duyệt và quan hệ phụ xem từ điển dữ liệu. Một FK nullable có 0..1 cha, FK bắt buộc có 1 cha.</text>
<text x="50" y="1021.75" text-anchor="start" font-size="15" fill="#182d49">serviceVisitId và ticketId UNIQUE: tối đa một phiếu/lượt và một chứng từ/phiếu. Booking lưu liên hệ, chưa có FK users.</text></g></svg>
