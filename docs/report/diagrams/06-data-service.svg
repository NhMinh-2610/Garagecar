<polygon points="400,400 391,396 391,404" fill="#526c8a"/>
<text x="360" y="388" text-anchor="middle" font-size="14" fill="#182d49">visitId</text>
<polyline points="540,340 540,255" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="540,255 536,264 544,264" fill="#526c8a"/>
<text x="584" y="298" text-anchor="middle" font-size="14" fill="#182d49">vehicleId</text>
<polyline points="800,400 680,400" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="680,400 689,404 689,396" fill="#526c8a"/>
<text x="741" y="387" text-anchor="middle" font-size="14" fill="#182d49">serviceVisitId</text>
<polyline points="940,340 940,255" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="940,255 936,264 944,264" fill="#526c8a"/>
<text x="991" y="301" text-anchor="middle" font-size="14" fill="#182d49">mechanicId</text>
<polyline points="850,340 850,290 650,290 650,255" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="650,255 646,264 654,264" fill="#526c8a"/>
<text x="752" y="281" text-anchor="middle" font-size="14" fill="#182d49">vehicleId</text>
<polyline points="540,590 540,530 880,530 880,465" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="880,465 876,474 884,474" fill="#526c8a"/>
<text x="700" y="518" text-anchor="middle" font-size="14" fill="#182d49">repairTicketId</text>
<polyline points="400,652 320,652" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="320,652 329,656 329,648" fill="#526c8a"/>
<text x="360" y="640" text-anchor="middle" font-size="14" fill="#182d49">inventoryId</text>
<polyline points="940,590 940,465" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
<polygon points="940,465 936,474 944,474" fill="#526c8a"/>
<text x="984" y="527" text-anchor="middle" font-size="14" fill="#182d49">ticketId</text>
<polyline points="180,820 180,715" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
