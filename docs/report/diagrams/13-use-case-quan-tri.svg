<text x="40" y="924" text-anchor="start" font-size="15" font-family="Segoe UI, Arial, sans-serif" class="muted">Nhân sự là chức năng của quản trị viên, không phải một vai trò đăng nhập riêng.</text>
<text x="40" y="948" text-anchor="start" font-size="15" font-family="Segoe UI, Arial, sans-serif" class="muted">Việc tự duyệt chi, nghỉ phép hoặc tự xác minh chứng chỉ bị giới hạn theo quy tắc nghiệp vụ.</text></svg>
