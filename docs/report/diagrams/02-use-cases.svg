<text x="50" y="895" text-anchor="start" font-size="15" fill="#182d49">Quản trị có thể xử lý nghiệp vụ theo quyền; vẫn chịu điều kiện trạng thái và quy tắc không tự duyệt.</text>
<text x="50" y="916.75" text-anchor="start" font-size="15" fill="#182d49">UC12 Bảo dưỡng/nhắc hạn: admin/cố vấn quản lý, khách xem xe mình. Các liên hệ phụ xem bảng use case.</text>
<text x="50" y="938.5" text-anchor="start" font-size="15" fill="#182d49">Nhân viên xem ca/gửi nghỉ cá nhân. Đặt lịch công khai không tạo thêm vai trò đăng nhập.</text></g></svg>
