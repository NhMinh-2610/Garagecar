<text x="575" y="229.4" text-anchor="middle" font-size="16" fill="#182d49">Proxy /api → backend</text>
<rect x="815" y="150" width="270" height="100" rx="12" fill="#e7f7ee" stroke="#8096b0" stroke-width="1.5" />
<text x="950" y="183" text-anchor="middle" font-size="16" fill="#182d49">FastAPI · backend</text>
