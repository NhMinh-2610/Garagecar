<text x="195" y="423" text-anchor="middle" font-size="16" fill="#182d49">Tài nguyên tĩnh</text>
<text x="195" y="446.2" text-anchor="middle" font-size="16" fill="#182d49">Service worker / offline shell</text>
<text x="195" y="469.4" text-anchor="middle" font-size="16" fill="#182d49">API không cache</text>
<polyline points="195,250 195,390" fill="none" stroke="#526c8a" stroke-width="1.7" marker-end="url(#arrow)" />
