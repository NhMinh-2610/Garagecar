<text x="195" y="229.4" text-anchor="middle" font-size="16" fill="#182d49">Web port mặc định 3000</text>
<rect x="435" y="150" width="280" height="100" rx="12" fill="#e7f7ee" stroke="#8096b0" stroke-width="1.5" />
<text x="575" y="183" text-anchor="middle" font-size="16" fill="#182d49">Nginx · frontend</text>
