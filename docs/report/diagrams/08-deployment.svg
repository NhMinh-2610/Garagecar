<rect x="435" y="390" width="280" height="100" rx="12" fill="#f0f3f7" stroke="#8096b0" stroke-width="1.5" />
<text x="575" y="423" text-anchor="middle" font-size="16" fill="#182d49">pgAdmin / pg_dump</text>
<text x="575" y="446.2" text-anchor="middle" font-size="16" fill="#182d49">Cổng host loopback 5434</text>
<text x="575" y="469.4" text-anchor="middle" font-size="16" fill="#182d49">Backup và kiểm tra dữ liệu</text>
