<text x="254" y="327" text-anchor="middle" font-size="14" fill="#182d49">Cache tĩnh</text>
<text x="50" y="560" text-anchor="start" font-size="16" fill="#182d49">API trực tiếp ở host 127.0.0.1:8001; DB host 127.0.0.1:5434. Biến cổng có thể thay đổi.</text>
<text x="50" y="583.2" text-anchor="start" font-size="16" fill="#182d49">PWA/camera trên điện thoại cần HTTPS phù hợp. URL/thiết bị thật phải kiểm tra khi demo.</text>
<text x="50" y="606.4" text-anchor="start" font-size="16" fill="#182d49">Database Docker độc lập với PostgreSQL Windows. Không xóa volume khi cần giữ dữ liệu.</text></g></svg>
