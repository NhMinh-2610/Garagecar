services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: garagecar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: garagecar
      POSTGRES_PASSWORD: garagecar
      POSTGRES_DB: garagecar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garagecar -d garagecar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: garagecar_backend
    restart: unless-stopped
    env_file:
      - ./be/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://garagecar:garagecar@db:5432/garagecar
      FORWARDED_ALLOW_IPS: ${TRUSTED_PROXY_CIDR:-172.30.0.0/24}
    command: sh -c "python -m alembic upgrade head && exec python -m uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    volumes:
      - ./fe:/fe:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks: [proxy, database]
    depends_on:
      db:
        condition: service_healthy

  # ── Nginx Frontend ───────────────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: garagecar_frontend
    restart: unless-stopped
    volumes:
      - ./fe:/usr/share/nginx/html:ro
      - ./be/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks: [proxy]

volumes:
  pgdata:

networks:
  database:
    internal: true
  proxy:
    ipam:
      config:
        - subnet: ${TRUSTED_PROXY_CIDR:-172.30.0.0/24}
