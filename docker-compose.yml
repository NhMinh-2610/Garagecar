services:
  # PostgreSQL cho moi truong local/demo.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: garagecar
      POSTGRES_PASSWORD: garagecar
      POSTGRES_DB: garagecar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garagecar -d garagecar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Migration duoc chay truoc khi khoi dong API.
  backend:
    build:
      context: .
      dockerfile: be/Dockerfile
    restart: unless-stopped
    env_file:
      - ./be/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://garagecar:garagecar@db:5432/garagecar
    command: sh -c "python -m alembic upgrade head && exec python -m uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      - ./fe:/fe:ro
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy

  # Frontend va API duoc phuc vu cung origin.
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./fe:/usr/share/nginx/html:ro
      - ./be/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
