<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AutoPro · Cố vấn dịch vụ</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="../shared/workspace.css" />
    <link rel="stylesheet" href="../shared/portals.css" />
    <link rel="stylesheet" href="../shared/care.css" />
    <script src="../shared/core.js" defer></script>
    <script src="../shared/access.js" defer></script>
    <script src="../shared/portal.js" defer></script>
    <script src="../shared/workspace.js" defer></script>
    <script src="../shared/tables.js" defer></script>
    <script src="../staff/app.js" defer></script>
    <script src="../shared/maintenance.js" defer></script>
    <script src="../shared/service.js" defer></script>
    <script src="../shared/pwa.js" defer></script>
    <link rel="stylesheet" href="../shared/professional.css" />
    <script src="../shared/evidence.js" defer></script>
    <script src="../shared/professional.js" defer></script>
    <link rel="stylesheet" href="../shared/chat.css" />
    <link rel="stylesheet" href="../shared/messaging.css" />
    <script src="../shared/messaging.js" defer></script>
  </head>
  <body data-staff-role="advisor">
    <aside id="sidebar">
      <a class="brand" href="/"
        ><span class="brand-mark">A</span><span>AutoPro<small>GARAGE WORKSPACE</small></span></a
      >
      <p class="nav-caption">CỐ VẤN DỊCH VỤ</p>
      <nav aria-label="Chức năng Cố vấn dịch vụ">
        <button class="nav-item" data-permission="reception" data-target="staffReception-section">
          Tiếp nhận & Lịch hẹn</button
        ><button class="nav-item" data-permission="workshop" data-target="service-section">
          Kiểm tra & Báo giá</button
        ><button class="nav-item" data-permission="maintenance" data-target="maintenance-section">
          Bảo dưỡng & Nhắc hạn
        </button>
        <button
          class="nav-item"
          data-title="Hộp thư khách hàng"
          data-permission="messages"
          data-target="messages-section"
        >
          Hộp thư khách hàng
          <span id="supportUnread" class="support-badge" hidden>0</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <h4>Cố vấn dịch vụ</h4>
          <small id="staffRole"></small>
        </div>
        <button class="btn" id="logoutBtn">Đăng xuất</button>
      </div>
    </aside>
    <div id="content">
      <header class="topbar">
        <button
          class="btn-icon toggle-sidebar"
          aria-label="Mở menu"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          ☰</button
        ><span id="pageTitle">Công việc</span
        ><span class="sync-label">Tự đồng bộ khi không thao tác</span
        ><button id="staffRefresh" class="btn btn-sm">Làm mới</button>
      </header>
      <main class="content-body">
        <p id="staffError" class="inline-message error" role="alert" hidden></p>
        <div class="role-intro">
          <strong>Cố vấn dịch vụ</strong>
          <p>Tiếp nhận, báo giá, điều phối kiểm tra và theo dõi khách sau sửa.</p>
        </div>
        <section id="staffReception-section">
          <div id="staffReception"></div>
        </section>
        <section id="service-section">
          <div id="serviceWorkspace"></div>
        </section>
        <section id="maintenance-section">
          <div id="maintenanceWorkspace"></div>
        </section>
        <section id="messages-section" aria-labelledby="supportTitle">
          <div id="supportWorkspace"></div>
        </section>
      </main>
    </div>
  </body>
</html>
