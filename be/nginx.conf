limit_req_zone $binary_remote_addr zone=garage_login:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=garage_register:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=garage_booking:10m rate=20r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types application/json application/javascript text/css;
    limit_req_status 429;
    error_page 429 = @garage_rate_limit;
    location @garage_rate_limit {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control no-store always;
        return 429 '{"success":false,"message":"Gửi yêu cầu quá nhanh. Vui lòng thử lại sau."}';
    }
    # Public edge: overwrite, never append forwarding headers from a client.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    location = /api/auth/login {
        limit_req zone=garage_login burst=20 nodelay;
        proxy_pass http://backend:8000;
        add_header Cache-Control no-store always;
    }
    location = /api/auth/register {
        limit_req zone=garage_register burst=5 nodelay;
        proxy_pass http://backend:8000;
        add_header Cache-Control no-store always;
    }
    location = /api/bookings {
        limit_req zone=garage_booking burst=10 nodelay;
        proxy_pass http://backend:8000;
        add_header Cache-Control no-store always;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        add_header Cache-Control no-store always;
    }
    location /static/ { alias /usr/share/nginx/html/; }
    location = /service-worker.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
