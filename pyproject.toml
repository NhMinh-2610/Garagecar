[tool.pytest.ini_options]
testpaths = ["be/tests"]
pythonpath = ["be", "be/tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["be/migrations/versions", "node_modules", ".venv", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
