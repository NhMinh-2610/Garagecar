[tool.pytest.ini_options]
testpaths = ["be/tests"]
pythonpath = ["be", "be/tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["be/migrations/versions", "tmp", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "database", "middleware", "models", "routers", "schemas", "services"]
